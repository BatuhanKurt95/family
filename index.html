<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hane fon takibi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#ECEFF3; --surface:#FFFFFF; --sunk:#F4F6F8; --ink:#17202A; --muted:#5B6776; --line:#D2D9E0;
  --b:#2350A0; --b-soft:#D9E3F4; --a:#AF2F3C; --a-soft:#F4DCDF; --gain:#15774A; --loss:#AF2F3C;
  --font:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --paper:#0D1217; --surface:#151C24; --sunk:#1B242E; --ink:#E5EBF0; --muted:#97A3B1; --line:#2A3541;
    --b:#80A6EE; --b-soft:#22324E; --a:#EC808B; --a-soft:#47242B; --gain:#57C792; --loss:#EC808B;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom,0px))}
header.top{padding:calc(18px + env(safe-area-inset-top,0px)) 0 4px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:21px;font-weight:600;margin:0;letter-spacing:-.01em}
.asof{color:var(--muted);font-size:13px}
nav.tabs{position:sticky;top:0;z-index:10;background:var(--paper);padding:calc(8px + env(safe-area-inset-top,0px)) 0 10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13.5px;font-weight:500;padding:8px 2px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);outline:1px solid var(--line)}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}
.hero{border-radius:20px;padding:20px 18px 18px}
.label{color:var(--muted);font-size:13px;margin:0}
.big{font-size:clamp(28px,8vw,40px);font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:4px 0 2px}
.usd{font-size:17px;font-weight:500;margin:0}
.usd small,.note{color:var(--muted);font-size:13px;font-weight:400}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:16px 0 10px;background:var(--sunk)}
.split span{display:block;height:100%}
.hb{background:repeating-linear-gradient(135deg,var(--b) 0 2px,var(--b-soft) 2px 6px)}
.ha{background:repeating-linear-gradient(135deg,var(--a) 0 2px,var(--a-soft) 2px 6px)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin:0;padding:0;list-style:none;font-size:13px}
.legend li{display:flex;flex-direction:column}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend b{font-weight:500}
.delta{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.pos{color:var(--gain)} .neg{color:var(--loss)}
.daily{display:grid;grid-template-columns:1fr;gap:6px;margin-top:12px}
.daily div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
@media (min-width:560px){.daily{grid-template-columns:repeat(3,1fr);gap:8px}.daily div{display:block;padding:10px 12px}}
.daily p{margin:0}
.daily .v{font-weight:600;font-size:15px}
.people{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
@media (min-width:640px){.people{grid-template-columns:1fr 1fr}}
.person{margin-top:0;border-left-width:4px}
.person.b{border-left-color:var(--b)} .person.a{border-left-color:var(--a)}
.person h2,.panel h2{font-size:16px;font-weight:600;margin:0}
.person .sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
dl.rows{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0;font-size:14px}
dl.rows dt{color:var(--muted)}
dl.rows dd{margin:0;text-align:right}
dl.rows .strong{font-weight:600}
dl.rows .sep{grid-column:1/-1;border-top:1px solid var(--line);margin:4px 0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink);font-size:16px;min-height:44px}
.field input:focus{border-color:var(--b);outline:none;box-shadow:0 0 0 2px var(--b-soft)}
.field .hint{font-size:12px;color:var(--muted);margin-top:3px;min-height:1em}
.row{display:flex;gap:8px;align-items:stretch}
.row input{flex:1;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:500;cursor:pointer;min-height:44px;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink);width:100%}
.btn.small{min-height:34px;padding:6px 10px;font-size:13px}
.btn.danger{color:var(--loss)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.preview{background:var(--sunk);border-radius:12px;padding:12px 14px;margin-top:4px}
.preview p{margin:0}
.err{color:var(--loss);font-size:13px}
details{margin-top:12px}
details>summary{cursor:pointer;font-weight:500;padding:4px 0}
.chartbox{position:relative;margin-top:8px}
.chartbox svg{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.readout{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:2px 16px}
.readout .d{flex-basis:100%;font-weight:600}
.toggle{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.toggle button{border:0;background:transparent;color:var(--muted);padding:5px 14px;cursor:pointer;font-weight:500}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ms{border-top:1px solid var(--line);margin:0}
.ms:first-of-type{border-top:0}
.ms summary{display:grid;grid-template-columns:auto 1fr;gap:0 12px;padding:10px 0;list-style:none}
.ms summary::-webkit-details-marker{display:none}
.ms summary .r{text-align:right}
.ms summary .r small{display:block;color:var(--muted);font-size:12.5px}
.ms dl{padding:0 0 12px}
.log{border-top:1px solid var(--line);padding:12px 0}
.log:first-child{border-top:0;padding-top:0}
.log .head p{margin:0;font-weight:600}
.log .meta{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.tag{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Hane fon takibi</h1>
    <span class="asof" id="asof"></span>
  </header>
  <nav class="tabs" aria-label="Bölümler">
    <div class="seg" role="tablist">
      <button role="tab" data-tab="ozet" aria-selected="true">Özet</button>
      <button role="tab" data-tab="guncelle" aria-selected="false">Güncelle</button>
      <button role="tab" data-tab="proj" aria-selected="false">Projeksiyon</button>
      <button role="tab" data-tab="kayit" aria-selected="false">Kayıtlar</button>
    </div>
  </nav>

  <main>
    <section id="tab-ozet" role="tabpanel"></section>

    <section id="tab-guncelle" role="tabpanel" hidden>
      <div class="panel">
        <h2>Günlük güncelleme</h2>
        <p class="note" style="margin:2px 0 14px">Tarihi seçin; kur otomatik çekilir. Fiyatı boş bırakırsanız günlük değişimden tahmin edilir.</p>
        <div class="form">
          <div class="field full">
            <label for="f-date">Tarih</label>
            <input type="date" id="f-date" max="2028-12-31">
          </div>
          <div class="field full">
            <label for="f-fx">USD/TRY kuru</label>
            <div class="row">
              <input id="f-fx" inputmode="decimal" autocomplete="off" placeholder="örn. 50,1607">
              <button class="btn" id="b-fx" type="button">Kuru getir</button>
            </div>
            <div class="hint" id="fx-status"></div>
          </div>
          <div class="field">
            <label for="f-py">YPT fiyatı (Batuhan)</label>
            <input id="f-py" inputmode="decimal" autocomplete="off">
            <div class="hint" id="h-py"></div>
          </div>
          <div class="field">
            <label for="f-pt">TZL fiyatı (Aybüke)</label>
            <input id="f-pt" inputmode="decimal" autocomplete="off">
            <div class="hint" id="h-pt"></div>
          </div>
          <div class="field">
            <label for="f-ry">YPT günlük değişim (%)</label>
            <input id="f-ry" inputmode="decimal" autocomplete="off" placeholder="örn. 0,0950">
            <div class="hint" id="h-ry"></div>
          </div>
          <div class="field">
            <label for="f-rt">TZL günlük değişim (%)</label>
            <input id="f-rt" inputmode="decimal" autocomplete="off" placeholder="örn. 0,0970">
            <div class="hint" id="h-rt"></div>
          </div>
          <p class="note full" style="margin:-4px 0 0">Günlük değişim için Salı–Cuma değerini girin; Pazartesi değeri hafta sonunu da kapsar.</p>
          <div class="preview full" id="preview"></div>
          <div class="full"><button class="btn primary" id="b-save" type="button">Kaydet</button></div>
        </div>
      </div>

      <details class="panel" id="settings">
        <summary>Ayarlar: pay, maliyet, stopaj ve diğer kalemler</summary>
        <div class="form" style="margin-top:12px">
          <div class="field"><label for="s-yu">YPT pay adedi</label><input id="s-yu" inputmode="decimal"></div>
          <div class="field"><label for="s-tu">TZL pay adedi</label><input id="s-tu" inputmode="decimal"></div>
          <div class="field"><label for="s-yc">YPT toplam maliyet (TL)</label><input id="s-yc" inputmode="decimal"></div>
          <div class="field"><label for="s-tc">TZL toplam maliyet (TL)</label><input id="s-tc" inputmode="decimal"></div>
          <div class="field"><label for="s-yt">YPT stopaj oranı (%)</label><input id="s-yt" inputmode="decimal"></div>
          <div class="field"><label for="s-tt">TZL stopaj oranı (%)</label><input id="s-tt" inputmode="decimal"></div>
          <div class="field"><label for="s-oc">Batuhan vadesiz TL</label><input id="s-oc" inputmode="decimal"></div>
          <div class="field"><label for="s-of">Batuhan döviz ve kıymetli madenler (TL)</label><input id="s-of" inputmode="decimal"></div>
          <div class="field"><label for="s-os">Batuhan hisse senedi (TL)</label><input id="s-os" inputmode="decimal"></div>
          <div class="field"><label for="s-oa">Aybüke nakit TL</label><input id="s-oa" inputmode="decimal"></div>
          <p class="err full" id="s-err" hidden></p>
          <div class="full row">
            <button class="btn" id="b-sset" type="button" style="flex:1">Ayarları kaydet</button>
            <button class="btn danger" id="b-reset" type="button">Başlangıç verilerine dön</button>
          </div>
        </div>
      </details>
    </section>

    <section id="tab-proj" role="tabpanel" hidden></section>
    <section id="tab-kayit" role="tabpanel" hidden></section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/*CORE-START*/
const END_DATE = '2028-12-31';
const MILESTONES = ['2026-12-31', '2027-06-30', '2027-12-31', '2028-06-30', '2028-12-31'];

function roundTo(x, d) {
  if (!Number.isFinite(x)) return NaN;
  const s = x < 0 ? -1 : 1, a = Math.abs(x), str = String(a);
  const v = str.indexOf('e') >= 0 ? Math.round(a * Math.pow(10, d)) : Math.round(Number(str + 'e' + d));
  return s * v / Math.pow(10, d);
}
const r2 = x => roundTo(x, 2);

function dnum(s) { const p = s.split('-').map(Number); return Math.round(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000); }
function dstr(n) { return new Date(n * 86400000).toISOString().slice(0, 10); }
function daysBetween(a, b) { return dnum(b) - dnum(a); }
function addDays(s, k) { return dstr(dnum(s) + k); }

// Tek fon: değer, kâr/zarar, stopaj, net ve günlük kazanç (kuruş yuvarlamalı)
function fundCalc(units, price, cost, taxPct, dailyPct) {
  const value = r2(units * price);
  const gain = r2(value - cost);
  const tax = r2(Math.max(0, gain) * taxPct / 100);
  const net = r2(value - tax);
  const ret = cost > 0 ? gain / cost * 100 : 0;
  const dGross = r2(value * dailyPct / 100);
  const dTax = r2((Math.max(0, gain + dGross) - Math.max(0, gain)) * taxPct / 100);
  const dNet = r2(dGross - dTax);
  return { units, price, cost, value, gain, tax, net, ret, dGross, dNet };
}

function snapCalc(base, s) {
  const Y = fundCalc(base.ypt.units, s.pY, base.ypt.cost, base.ypt.tax, s.rY);
  const T = fundCalc(base.tzl.units, s.pT, base.tzl.cost, base.tzl.tax, s.rT);
  const o = base.other;
  const bOther = r2(o.bCash + o.bFx + o.bStock);
  const aOther = r2(o.aCash);
  const other = r2(bOther + aOther);
  const gross = r2(Y.value + T.value);
  const tax = r2(Y.tax + T.tax);
  const net = r2(Y.net + T.net);
  const netAll = r2(net + other);
  const fx = s.fx;
  return {
    Y, T, gross, tax, net, bOther, aOther, other, netAll, fx,
    netUsd: r2(net / fx), netAllUsd: r2(netAll / fx),
    yNetUsd: r2(Y.net / fx), tNetUsd: r2(T.net / fx),
    dGross: r2(Y.dGross + T.dGross), dNet: r2(Y.dNet + T.dNet)
  };
}

function annualFromDaily(pct) { return (Math.pow(1 + pct / 100, 365) - 1) * 100; }

// Projeksiyon: günlük getiri bugünkü değerden 2028 sonu değerine doğrusal değişir,
// takvim günü bazında bileşiklenir; kur yıllık sabit oranla artar.
function buildProjection(base, s0, o) {
  const N = daysBetween(s0.date, END_DATE);
  if (N <= 0) return null;
  const rateY = k => s0.rY + (o.rEndY - s0.rY) * k / N;
  const rateT = k => s0.rT + (o.rEndT - s0.rT) * k / N;
  const gY = new Float64Array(N + 1), gT = new Float64Array(N + 1);
  gY[0] = 1; gT[0] = 1;
  for (let k = 1; k <= N; k++) {
    gY[k] = gY[k - 1] * (1 + rateY(k) / 100);
    gT[k] = gT[k - 1] * (1 + rateT(k) / 100);
  }
  function at(k) {
    k = Math.max(0, Math.min(N, Math.round(k)));
    const snap = {
      date: addDays(s0.date, k),
      pY: s0.pY * gY[k], pT: s0.pT * gT[k],
      rY: rateY(k), rT: rateT(k),
      fx: s0.fx * Math.pow(1 + o.fxg / 100, k / 365)
    };
    return { k, snap, c: snapCalc(base, snap) };
  }
  return { N, at };
}

function estimatePrice(refPrice, refDate, date, dailyPct) {
  return roundTo(refPrice * Math.pow(1 + dailyPct / 100, daysBetween(refDate, date)), 6);
}

function parseNum(v) {
  if (v == null) return NaN;
  let s = String(v).replace(/\u2212/g, '-').replace(/\s|%|TL|USD|\$|₺/gi, '');
  if (!s) return NaN;
  const nd = (s.match(/\./g) || []).length, nc = (s.match(/,/g) || []).length;
  if (nc > 1) return NaN;
  if (nc === 1) s = s.replace(/\./g, '').replace(',', '.');
  else if (nd > 1) s = s.replace(/\./g, '');
  if (!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
  return Number(s);
}
/*CORE-END*/

/* ---------- Başlangıç verileri (06.11.2026 ekran görüntüleri) ---------- */
const DEFAULTS = {
  v: 1,
  base: {
    // YPT: Fon toplamı 23.307.635,45 − Kâr/zarar 8.027.897,39 = toplam maliyet
    ypt: { units: 5216987, cost: r2(23307635.45 - 8027897.39), tax: 17.5 },
    // TZL: pay = toplam varlık / fiyat; maliyet ekrandaki değer
    tzl: { units: Math.round(3577579.59 / 0.148951), cost: 2971245.67, tax: 17.5 },
    // Diğer varlıklar (borçlar dahil edilmez)
    other: { bCash: 9307.99, bFx: 2175.38, bStock: 99.71, aCash: 10000 }
  },
  proj: { target: END_DATE, fxg: 19, rEndY: null, rEndT: null },
  snaps: [
    { date: '2026-11-06', fx: 50.1607, fxSrc: 'Serbest piyasa satış, 09:30', pY: 4.467643, pT: 0.148951, rY: 0.095, rT: 0.097, estY: false, estT: false }
  ]
};

/* ---------- Biçimlendirme ---------- */
const NF = {};
const nf = d => NF[d] || (NF[d] = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: d, maximumFractionDigits: d }));
const tl = x => nf(2).format(x) + ' TL';
const usd = x => nf(2).format(x) + ' USD';
const pct = (x, d = 2) => '%' + nf(d).format(x);
const sgn = (x, f) => (x > 0 ? '+' : x < 0 ? '−' : '') + f(Math.abs(x));
const cls = x => x > 0 ? 'pos' : x < 0 ? 'neg' : '';
const inNum = (x, d) => Number.isFinite(x) ? x.toFixed(d).replace('.', ',') : '';
const DAYS = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
const dmy = s => s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4);
const wday = s => DAYS[new Date(dnum(s) * 86400000).getUTCDay()];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const $ = (s, el = document) => el.querySelector(s);

/* ---------- Depolama ---------- */
const KEY = 'hane-fon-takibi-v2', OLD_KEY = 'hane-fon-takibi-v1';
const store = {
  async load() {
    try { if (window.storage && window.storage.get) { const r = await window.storage.get(KEY, false); if (r && r.value) return JSON.parse(r.value); } } catch (e) {}
    try { const v = localStorage.getItem(KEY); if (v) return JSON.parse(v); } catch (e) {}
    return null;
  },
  async loadOld() {
    try { if (window.storage && window.storage.get) { const r = await window.storage.get(OLD_KEY, false); if (r && r.value) return JSON.parse(r.value); } } catch (e) {}
    try { const v = localStorage.getItem(OLD_KEY); if (v) return JSON.parse(v); } catch (e) {}
    return null;
  },
  async save(obj) {
    const v = JSON.stringify(obj);
    let ok = false;
    try { if (window.storage && window.storage.set) { const r = await window.storage.set(KEY, v, false); ok = ok || !!r; } } catch (e) {}
    try { localStorage.setItem(KEY, v); ok = true; } catch (e) {}
    return ok;
  }
};

let S = JSON.parse(JSON.stringify(DEFAULTS));
let tab = 'ozet', chartMode = 'TL', fxSrcCur = '', fxToken = 0, scrubK = null;

function valid(st) {
  const okNum = x => Number.isFinite(x);
  try {
    const b = st.base;
    if (!(okNum(b.ypt.units) && okNum(b.ypt.cost) && okNum(b.ypt.tax) && okNum(b.tzl.units) && okNum(b.tzl.cost) && okNum(b.tzl.tax))) return false;
    if (!['bCash', 'bFx', 'bStock', 'aCash'].every(k => okNum(b.other[k]))) return false;
    if (!Array.isArray(st.snaps) || !st.snaps.length) return false;
    return st.snaps.every(s => /^\d{4}-\d{2}-\d{2}$/.test(s.date) && s.fx > 0 && s.pY > 0 && s.pT > 0 && okNum(s.rY) && okNum(s.rT));
  } catch (e) { return false; }
}
function persist() { store.save(S); }

const sorted = () => S.snaps.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
const latest = () => { const s = sorted(); return s[s.length - 1]; };
const prevOf = d => { const s = sorted().filter(x => x.date < d); return s[s.length - 1] || null; };
const nextOf = d => sorted().find(x => x.date > d) || null;

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200);
}

function confirmTwice(btn, label, fn) {
  if (btn.dataset.armed === '1') { btn.dataset.armed = ''; btn.textContent = label; fn(); return; }
  btn.dataset.armed = '1'; btn.textContent = 'Onaylamak için tekrar dokunun';
  setTimeout(() => { if (btn.isConnected && btn.dataset.armed === '1') { btn.dataset.armed = ''; btn.textContent = label; } }, 4000);
}

/* ---------- Güncelle ---------- */
const F = { date: $('#f-date'), fx: $('#f-fx'), py: $('#f-py'), pt: $('#f-pt'), ry: $('#f-ry'), rt: $('#f-rt') };

function refFor(date) { return prevOf(date) || nextOf(date); }

function readForm() {
  const date = F.date.value, errs = [];
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) errs.push('Tarih seçin.');
  else if (date > todayStr()) errs.push('Gelecek tarih kaydedilemez; ileri tarihler için Projeksiyon sekmesini kullanın.');
  const fx = parseNum(F.fx.value);
  if (!(fx > 0)) errs.push('USD/TRY kurunu girin.');
  const rY = parseNum(F.ry.value), rT = parseNum(F.rt.value);
  if (!Number.isFinite(rY) || Math.abs(rY) > 5) errs.push('YPT günlük değişimini girin (örn. 0,0950).');
  if (!Number.isFinite(rT) || Math.abs(rT) > 5) errs.push('TZL günlük değişimini girin (örn. 0,0970).');
  let pY = parseNum(F.py.value), pT = parseNum(F.pt.value), estY = false, estT = false;
  const ref = /^\d{4}-\d{2}-\d{2}$/.test(date) ? refFor(date) : null;
  if (!F.py.value.trim() && ref && Number.isFinite(rY)) { pY = estimatePrice(ref.pY, ref.date, date, rY); estY = true; }
  if (!F.pt.value.trim() && ref && Number.isFinite(rT)) { pT = estimatePrice(ref.pT, ref.date, date, rT); estT = true; }
  if (!(pY > 0)) errs.push('YPT fiyatını girin veya boş bırakın.');
  if (!(pT > 0)) errs.push('TZL fiyatını girin veya boş bırakın.');
  return { date, fx, pY, pT, rY, rT, estY, estT, errs };
}

function updateHints() {
  const date = F.date.value; if (!date) return;
  const ref = refFor(date);
  const rY = parseNum(F.ry.value), rT = parseNum(F.rt.value);
  const h = (el, key, r, cur) => {
    if (cur.value.trim() || !ref || !Number.isFinite(r)) { el.textContent = ''; cur.placeholder = ''; return; }
    const v = estimatePrice(ref[key], ref.date, date, r);
    cur.placeholder = 'tahmin ' + inNum(v, 6);
    el.textContent = 'Boşsa ' + dmy(ref.date) + ' fiyatından tahmin';
  };
  h($('#h-py'), 'pY', rY, F.py); h($('#h-pt'), 'pT', rT, F.pt);
  $('#h-ry').textContent = Number.isFinite(rY) ? 'Yıllık karşılığı ' + pct(annualFromDaily(rY), 1) : '';
  $('#h-rt').textContent = Number.isFinite(rT) ? 'Yıllık karşılığı ' + pct(annualFromDaily(rT), 1) : '';
}

function updatePreview() {
  updateHints();
  const r = readForm(), el = $('#preview');
  if (r.errs.length) { el.innerHTML = '<p class="err">' + r.errs.map(esc).join('<br>') + '</p>'; $('#b-save').disabled = true; return; }
  $('#b-save').disabled = false;
  const c = snapCalc(S.base, r), p = prevOf(r.date);
  let d = '';
  if (p) {
    const pc = snapCalc(S.base, p), n = daysBetween(p.date, r.date);

function fillForm(date) {
  F.date.max = todayStr() < END_DATE ? todayStr() : END_DATE;
  F.date.value = date;
  const ex = S.snaps.find(x => x.date === date);
  const ref = ex || refFor(date) || latest();
  if (ex) {
    F.fx.value = inNum(ex.fx, 4); fxSrcCur = ex.fxSrc || 'Elle girildi';
    F.py.value = ex.estY ? '' : inNum(ex.pY, 6);
    F.pt.value = ex.estT ? '' : inNum(ex.pT, 6);

    $('#fx-status').textContent = '';
  }
  F.ry.value = inNum(ref.rY, 4); F.rt.value = inNum(ref.rT, 4);
  updatePreview();
  if (!ex) fetchFx();
}

async function fetchJSON(url, ms) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms || 7000);
  try {
    const r = await fetch(url, { signal: ctl.signal, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

async function getUsdTry(date) {
  const fr = j => ({ rate: j && j.rates && j.rates.TRY, date: j && j.date });
  const ca = j => ({ rate: j && j.usd && j.usd.try, date: j && j.date });
  const list = [
    { src: 'ECB referans kuru (Frankfurter)', url: 'https://api.frankfurter.dev/v1/' + date + '?base=USD&symbols=TRY', pick: fr },
    { src: 'ECB referans kuru (Frankfurter)', url: 'https://api.frankfurter.app/' + date + '?from=USD&to=TRY', pick: fr },
    { src: 'Currency API', url: 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@' + date + '/v1/currencies/usd.min.json', pick: ca },
    { src: 'Currency API', url: 'https://' + date + '.currency-api.pages.dev/v1/currencies/usd.min.json', pick: ca }
  ];
  if (date >= todayStr()) list.push({ src: 'Currency API (en güncel)', url: 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json', pick: ca });
  for (const it of list) {
    try {
      const p = it.pick(await fetchJSON(it.url));
      if (Number.isFinite(p.rate) && p.rate > 1) return { rate: p.rate, date: p.date || date, src: it.src };
    } catch (e) {}
  }
  return null;
}

async function fetchFx() {
  const date = F.date.value; if (!date) return;
  if (date > todayStr()) { $('#fx-status').textContent = 'Gelecek tarih için kur çekilemez.'; return; }
  const my = ++fxToken, btn = $('#b-fx');
  btn.disabled = true; $('#fx-status').textContent = 'Kur çekiliyor…';
  const res = await getUsdTry(date);
  if (my !== fxToken) return;
  btn.disabled = false;
  if (res) {
    F.fx.value = inNum(roundTo(res.rate, 4), 4);
    fxSrcCur = res.src + (res.date !== date ? ', ' + dmy(res.date) + ' kuru' : '');
    $('#fx-status').textContent = 'Kaynak: ' + fxSrcCur;
  } else {
    $('#fx-status').innerHTML = 'Kur otomatik alınamadı; elle girin. <a href="https://www.tcmb.gov.tr/kurlar/kurlar_tr.html" target="_blank" rel="noopener">TCMB kurları</a>';
  }
  updatePreview();
}

F.date.addEventListener('change', () => { if (F.date.value) fillForm(F.date.value); });
F.fx.addEventListener('input', () => { fxSrcCur = 'Elle girildi'; $('#fx-status').textContent = ''; updatePreview(); });
[F.py, F.pt, F.ry, F.rt].forEach(el => el.addEventListener('input', updatePreview));
$('#b-fx').addEventListener('click', fetchFx);
$('#b-save').addEventListener('click', () => {

  S.snaps = S.snaps.filter(x => x.date !== r.date).concat(snap);
  persist(); renderAll(); switchTab('ozet'); toast('Kaydedildi');
});

/* ---------- Projeksiyon ---------- */
function projOpts() {
  const s = latest(), p = S.proj;
  return {
    target: p.target && p.target > s.date && p.target <= END_DATE ? p.target : END_DATE,
    fxg: Number.isFinite(p.fxg) ? p.fxg : 19,
    rEndY: Number.isFinite(p.rEndY) ? p.rEndY : s.rY,
    rEndT: Number.isFinite(p.rEndT) ? p.rEndT : s.rT
  };
}

function chartPoints(P, s0) {
  const pts = [P.at(0)];
  let y = Number(s0.date.slice(0, 4)), m = Number(s0.date.slice(5, 7));
  for (;;) {
    const me = dstr(Math.round(Date.UTC(y, m, 0) / 86400000));
    if (me > END_DATE) break;
    if (me > s0.date) pts.push(P.at(daysBetween(s0.date, me)));
    m++; if (m > 12) { m = 1; y++; }
  }
  return pts;
}

function drawChart(pts, s0, W) {
  const H = W < 500 ? 210 : 250, L = 50, R = 12, T = 12, B = 28;
  const N = pts[pts.length - 1].k || 1;
  const val = p => chartMode === 'TL' ? p.c.net : p.c.netUsd;
  const vs = pts.map(val);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  const pad = (hi - lo) * 0.08 || Math.abs(hi) * 0.05 || 1; lo -= pad; hi += pad;
  const X = k => L + (W - L - R) * k / N, Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const lab = v => chartMode === 'TL' ? nf(1).format(v / 1e6) + ' mn' : nf(0).format(v / 1e3) + ' bin';
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, y = Y(v).toFixed(1);
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
      <text x="${L - 6}" y="${y}" dy="4" text-anchor="end" font-size="11" fill="var(--muted)">${lab(v)}</text>`;
  }
  ['2027-01-01', '2028-01-01'].forEach(d => {
    if (d <= s0.date) return;
    const x = X(daysBetween(s0.date, d)).toFixed(1);
    g += `<line x1="${x}" x2="${x}" y1="${T}" y2="${H - B}" stroke="var(--line)" stroke-dasharray="3 3"/>
      <text x="${x}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.slice(0, 4)}</text>`;
  });
  g += `<text x="${W - R}" y="${H - 10}" text-anchor="end" font-size="11" fill="var(--muted)">2028 sonu</text>`;
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p.k).toFixed(1) + ' ' + Y(val(p)).toFixed(1)).join(' ');
  const area = d + ` L ${X(N).toFixed(1)} ${H - B} L ${X(0).toFixed(1)} ${H - B} Z`;
  return { svg: `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Hane net varlık projeksiyonu">${g}
    <path d="${area}" fill="var(--b-soft)" opacity=".55"/>
    <path d="${d}" fill="none" stroke="var(--b)" stroke-width="2.25" stroke-linejoin="round"/>
    <line id="cx" y1="${T}" y2="${H - B}" stroke="var(--ink)" stroke-width="1" opacity=".5"/>
    <circle id="cc" r="4.5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
    <rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent" id="hit"/></svg>`, X, Y, val, W, L, R };
}

function msRows(r, base0) {

    $('#readout').innerHTML = `<span class="d">${dmy(r.snap.date)}</span>
      <span>Net ${tl(r.c.net)}</span><span>${usd(r.c.netUsd)}</span>
      <span class="note">Batuhan ${tl(r.c.Y.net)}</span><span class="note">Aybüke ${tl(r.c.T.net)}</span>`;
  };
  const fromEvt = e => {
    const b = svg.getBoundingClientRect(), sx = (e.clientX - b.left) / b.width * ch.W;
    scrubK = Math.max(0, Math.min(N, Math.round((sx - ch.L) / (ch.W - ch.L - ch.R) * N)));
    show(scrubK);
  };
  svg.addEventListener('pointerdown', fromEvt);
  svg.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) fromEvt(e); });
  show(scrubK != null && scrubK <= N ? scrubK : kT);
}
let rzT;
window.addEventListener('resize', () => {
  clearTimeout(rzT);
  rzT = setTimeout(() => { const box = $('#chartbox'); if (tab === 'proj' && box && Math.abs(box.clientWidth - lastChartW) > 2) paintChart(); }, 150);
});

function renderProjection() {
  const s = latest(), el = $('#tab-proj');
  if (s.date >= END_DATE) { el.innerHTML = '<div class="panel"><p>Son kayıt 31.12.2028 veya sonrasında; projeksiyon dönemi tamamlandı.</p></div>'; return; }
  const o = projOpts();
  el.innerHTML = `
  <div class="panel">
    <h2>Varsayımlar</h2>
    <p class="note" style="margin:2px 0 12px">Başlangıç: ${dmy(s.date)} kaydı. Günlük getiri bugünkü değerden 2028 sonu değerine doğrusal değişir ve her takvim günü bileşiklenir. 2028 sonu getirisini boş bırakırsanız bugünkü değer sabit kalır.</p>
    <div class="form">
      <div class="field"><label for="p-tg">Hedef tarih</label><input type="date" id="p-tg" min="${addDays(s.date, 1)}" max="${END_DATE}" value="${o.target}"><div class="hint" id="hp-tg"></div></div>
      <div class="field"><label for="p-fx">Yıllık kur artışı (%)</label><input id="p-fx" inputmode="decimal" autocomplete="off" value="${inNum(o.fxg, 1)}"><div class="hint" id="hp-fx"></div></div>
      <div class="field"><label for="p-ry">2028 sonu YPT günlük (%)</label><input id="p-ry" inputmode="decimal" autocomplete="off" placeholder="${inNum(s.rY, 4)}" value="${Number.isFinite(S.proj.rEndY) ? inNum(S.proj.rEndY, 4) : ''}"><div class="hint" id="hp-ry"></div></div>
      <div class="field"><label for="p-rt">2028 sonu TZL günlük (%)</label><input id="p-rt" inputmode="decimal" autocomplete="off" placeholder="${inNum(s.rT, 4)}" value="${Number.isFinite(S.proj.rEndT) ? inNum(S.proj.rEndT, 4) : ''}"><div class="hint" id="hp-rt"></div></div>
    </div>
  </div>
  <div id="proj-res"></div>`;
  let t;
  const onEdit = () => { clearTimeout(t); t = setTimeout(() => { readProj(); renderProjResults(); persist(); }, 250); };
  $('#p-tg').addEventListener('change', onEdit);
  ['#p-fx', '#p-ry', '#p-rt'].forEach(id => $(id).addEventListener('input', onEdit));
  renderProjResults();
}

function readProj() {
  const s = latest(), tg = $('#p-tg').value, fx = parseNum($('#p-fx').value);
  if (tg && tg > s.date && tg <= END_DATE) S.proj.target = tg;
  if (Number.isFinite(fx) && fx > -100 && fx <= 500) S.proj.fxg = fx;
  [['#p-ry', 'rEndY'], ['#p-rt', 'rEndT']].forEach(([id, key]) => {
    const raw = $(id).value.trim(), v = parseNum(raw);
    if (raw === '') S.proj[key] = null;
    else if (Number.isFinite(v) && Math.abs(v) <= 5) S.proj[key] = v;
  });
  scrubK = null;
}

function renderProjResults() {
  const s = latest(), o = projOpts(), P = buildProjection(S.base, s, o), base0 = snapCalc(S.base, s);
  const bad = (id, ok) => ok ? '' : 'Geçersiz değer; son geçerli değer kullanılıyor. ';
  const fxRaw = parseNum($('#p-fx').value);
  $('#hp-tg').textContent = daysBetween(s.date, o.target) + ' gün sonra';
  $('#hp-fx').textContent = bad('fx', Number.isFinite(fxRaw) && fxRaw > -100 && fxRaw <= 500) + '2028 sonu kuru ' + nf(2).format(P.at(P.N).c.fx);
  [['#p-ry', 'hp-ry', 'rEndY'], ['#p-rt', 'hp-rt', 'rEndT']].forEach(([id, hid, key]) => {
    const raw = $(id).value.trim(), v = parseNum(raw);
    const ok = raw === '' || (Number.isFinite(v) && Math.abs(v) <= 5);
    $('#' + hid).textContent = bad(hid, ok) + 'Yıllık karşılığı ' + pct(annualFromDaily(o[key]), 1) + (Number.isFinite(S.proj[key]) ? '' : ', sabit');
  });
  const kT = daysBetween(s.date, o.target), RT = P.at(kT);
  const dT = r2(RT.c.net - base0.net), dU = r2(RT.c.netUsd - base0.netUsd);
  const dates = MILESTONES.filter(d => d > s.date);
  if (!dates.includes(o.target)) dates.push(o.target);
  dates.sort();
  const ms = dates.map(d => {
    const r = P.at(daysBetween(s.date, d));
    return `<details class="ms"><summary><span>${dmy(d)}${d === o.target ? '<span class="tag">hedef</span>' : ''}</span>
      <span class="r">${tl(r.c.net)}<small>${usd(r.c.netUsd)}</small></span></summary>${msRows(r, base0)}</details>`;
  }).join('');
  $('#proj-res').innerHTML = `
  <div class="panel hero">
    <p class="label">${dmy(o.target)} itibarıyla hane net (stopaj sonrası)</p>
    <p class="big">${tl(RT.c.net)}</p>
    <p class="usd">${usd(RT.c.netUsd)} <small>kur ${nf(2).format(RT.c.fx)}</small></p>
    <p style="margin:10px 0 0"><span class="${cls(dT)}" style="font-weight:600">${sgn(dT, tl)}</span> <span class="${cls(dU)}">/ ${sgn(dU, usd)}</span> <span class="note">${kT} günde</span></p>
    <p class="note" style="margin:4px 0 0">Batuhan ${tl(RT.c.Y.net)}, Aybüke ${tl(RT.c.T.net)}, toplam stopaj ${tl(RT.c.tax)}</p>
  </div>
  <div class="panel">
    <div class="head"><h2>2028 sonuna kadar</h2>
      <div class="toggle" role="group" aria-label="Para birimi"><button type="button" data-m="TL" aria-pressed="${chartMode === 'TL'}">TL</button><button type="button" data-m="USD" aria-pressed="${chartMode === 'USD'}">USD</button></div></div>
    <div class="chartbox" id="chartbox"></div>
    <div class="readout" id="readout"></div>
  </div>
  <div class="panel"><h2>Ara tarihler</h2><p class="note" style="margin:2px 0 4px">Ayrıntı için tarihe dokunun.</p><div>${ms}</div></div>`;
  PC = { P, s, kT };
  paintChart();
  $('#proj-res').querySelectorAll('.toggle button').forEach(b => b.addEventListener('click', () => {
    chartMode = b.dataset.m;
    $('#proj-res').querySelectorAll('.toggle button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.m === chartMode)));
    paintChart();
  }));
}

/* ---------- Kayıtlar ---------- */
function renderLog() {
  const list = sorted();
  const rows = list.map((s, i) => {
    const c = snapCalc(S.base, s), p = list[i - 1];
    let d = '<p class="meta">İlk kayıt</p>';
    if (p) {
      const pc = snapCalc(S.base, p), n = daysBetween(p.date, s.date);
      const dT = r2(c.net - pc.net), dU = r2(c.netUsd - pc.netUsd);
      d = `<p class="meta">Önceki kayda göre (${n} gün): <span class="${cls(dT)}">${sgn(dT, tl)}</span> / <span class="${cls(dU)}">${sgn(dU, usd)}</span>, günlük ort. ${sgn(r2(dT / n), tl)}</p>`;
    }
    return `<div class="log">
      <div class="head"><p>${dmy(s.date)} <span class="note">${wday(s.date)}</span></p>
        <span><button class="btn small" data-edit="${s.date}" type="button">Düzenle</button>
        <button class="btn small danger" data-del="${s.date}" type="button" ${list.length < 2 ? 'disabled' : ''}>Sil</button></span></div>
      <p style="margin:4px 0 0">Net <b>${tl(c.net)}</b>, ${usd(c.netUsd)}</p>
      ${d}
      <p class="meta">Kur ${nf(4).format(s.fx)} (${esc(s.fxSrc || 'Elle girildi')}). YPT ${nf(6).format(s.pY)}${s.estY ? '<span class="tag">tahmini</span>' : ''}, TZL ${nf(6).format(s.pT)}${s.estT ? '<span class="tag">tahmini</span>' : ''}. Günlük ${pct(s.rY, 4)} / ${pct(s.rT, 4)}</p>
    </div>`;
  }).reverse().join('');
  $('#tab-kayit').innerHTML = `<div class="panel"><h2>Kayıtlar</h2><p class="note" style="margin:2px 0 10px">${list.length} kayıt. Değerler güncel ayarlarla yeniden hesaplanır.</p>${rows}</div>`;
  $('#tab-kayit').querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => { fillForm(b.dataset.edit); switchTab('guncelle'); }));
  $('#tab-kayit').querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => confirmTwice(b, 'Sil', () => {
    S.snaps = S.snaps.filter(x => x.date !== b.dataset.del); persist(); renderAll(); toast('Kayıt silindi');
  })));
}

function renderAll() { renderSummary(); renderLog(); fillSettings(); if (tab === 'proj') renderProjection(); }

(async function init() {
  let saved = await store.load();
  if (!saved) {
    const old = await store.loadOld();
    if (old && old.base && old.base.other && 'card' in old.base.other) {
      const o = old.base.other;
      old.base.other = { bCash: o.cash, bFx: o.fx, bStock: o.stock, aCash: DEFAULTS.base.other.aCash };
      saved = old;
    }
  }
  if (saved && valid(saved)) {
    S = saved;
    S.proj = Object.assign({}, DEFAULTS.proj, S.proj || {});
    persist();
  }
  renderAll();
  fillForm(todayStr() <= END_DATE ? todayStr() : latest().date);
})();
</script>
</body>
